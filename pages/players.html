<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player Search — Jennings Hub</title>
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Jennings Hub">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/boot.js"></script>
<style>
  .search { position: relative; margin-bottom: 14px; }
  .search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .search input { width: 100%; margin: 0; padding: 13px 14px 13px 42px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 1rem; }
  .sec-label { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin: 16px 2px 8px; display: flex; justify-content: space-between; align-items: center; }
  .sec-label button { background: none; border: 0; color: var(--ink-accent); font-weight: 700; font-size: 0.74rem; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .p-row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 7px; text-decoration: none; color: var(--text); }
  .p-row .hs { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
  .p-row .nm { font-weight: 700; font-size: 0.94rem; }
  .p-row .lb { font-size: 0.74rem; color: var(--text-muted); margin-top: 1px; }
  .p-row .chev { margin-left: auto; color: var(--text-muted); }

  .hero { position: relative; overflow: hidden; border-radius: var(--radius-lg); padding: 18px 16px 16px; margin-bottom: 14px; color: #fff; background: linear-gradient(145deg, var(--tc, #2a3442), #0d131c); box-shadow: var(--shadow-md); min-height: 150px; }
  .hero .logo-bg { position: absolute; right: -30px; top: -20px; width: 190px; height: 190px; object-fit: contain; opacity: 0.12; }
  .hero .hs { position: absolute; right: 6px; bottom: 0; height: 140px; width: auto; max-width: 48%; object-fit: contain; }
  .hero .info { position: relative; max-width: 60%; }
  .hero .num { font-family: var(--font-display); font-weight: 800; font-size: 0.85rem; opacity: 0.85; }
  .hero .nm { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; line-height: 1.1; letter-spacing: -0.02em; margin-top: 2px; }
  .hero .tm { font-size: 0.82rem; opacity: 0.9; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .hero .tm img { width: 20px; height: 20px; object-fit: contain; }
  .hero .inj { display: inline-block; margin-top: 8px; font-size: 0.7rem; font-weight: 800; background: rgba(255, 90, 79, 0.9); border-radius: 5px; padding: 2px 6px; }
  .bio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .bio > div { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 6px; text-align: center; }
  .bio .v { font-weight: 700; font-size: 0.84rem; }
  .bio .k { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .seg-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg-tabs button { flex: 1; padding: 9px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; cursor: pointer; }
  .seg-tabs button.active { background: var(--primary); color: #fff; border-color: transparent; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 6px; text-align: center; }
  .stat-tile .n { font-family: var(--font-mono); font-weight: 700; font-size: 1.02rem; }
  .stat-tile .k { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 2px; }
  .stat-tile .r { font-size: 0.6rem; color: var(--accent); margin-top: 2px; }
  .split-h { font-size: 0.78rem; font-weight: 800; color: var(--text-muted); margin: 6px 2px 8px; text-transform: uppercase; letter-spacing: 0.06em; }
  .box-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
  table.gl { border-collapse: collapse; width: 100%; font-size: 0.76rem; }
  table.gl th, table.gl td { padding: 7px 7px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  table.gl tr:last-child td { border-bottom: 0; }
  table.gl th { font-size: 0.64rem; color: var(--text-muted); text-transform: uppercase; }
  table.gl th:first-child, table.gl td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
  table.gl td { font-family: var(--font-mono); }
  table.gl td:first-child { font-family: var(--font-body); font-weight: 600; }
  table.gl .W { color: var(--success); } table.gl .L { color: var(--danger); }
  .news-card { display: flex; gap: 12px; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; text-decoration: none; color: var(--text); }
  .news-card img { width: 92px; height: 62px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: var(--surface-2); }
  .news-card .hl { font-weight: 700; font-size: 0.86rem; line-height: 1.3; }
  .news-card .meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body data-sw-path="../sw.js">

<header class="app-header">
  <a href="sports.html" class="back-link" id="back-link" aria-label="Back">←</a>
  <div><h1 id="page-title">Player Search</h1></div>
</header>

<main class="shell">
  <section id="search-view">
    <div id="nav-slot"></div>
    <div class="search">
      <span data-icon="search" data-size="18"></span>
      <input type="search" id="q" placeholder="Search any player — NFL, NBA, MLB, college…" autocomplete="off" enterkeyhint="search">
    </div>
    <div id="results"></div>
  </section>
  <section id="player-view" class="hidden"></section>
</main>

<script src="../js/app.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/sports-common.js"></script>
<script>
  const esc = toolkitEscapeHtml;
  const SEARCH_URL = 'https://site.web.api.espn.com/apis/common/v3/search';
  const RECENT_KEY = 'toolkit-player-recent';
  const LEAGUE_LABEL = { nfl: 'NFL', nba: 'NBA', mlb: 'MLB', nhl: 'NHL', wnba: 'WNBA', 'college-football': 'College Football', 'mens-college-basketball': 'College Basketball', 'womens-college-basketball': "Women's College Basketball" };

  document.getElementById('nav-slot').replaceWith(sportsRenderNav('players'));
  toolkitHydrateIcons();

  const getRecent = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch (e) { return []; } };
  function addRecent(p) {
    const list = getRecent().filter((x) => !(x.id === p.id && x.league === p.league));
    list.unshift(p);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 12))); } catch (e) {}
  }

  function playerUrl(p) { return `players.html?sport=${encodeURIComponent(p.sport)}&league=${encodeURIComponent(p.league)}&id=${encodeURIComponent(p.id)}`; }

  function rowHtml(p) {
    return `
      <a class="p-row" href="${playerUrl(p)}">
        ${p.headshot ? sportsImg(p.headshot, 'hs') : '<div class="hs"></div>'}
        <div style="min-width:0">
          <div class="nm">${esc(p.name)}</div>
          <div class="lb">${esc([p.pos, p.jersey ? '#' + p.jersey : '', p.label].filter(Boolean).join(' · '))}</div>
        </div>
        <span class="chev">${toolkitIcon('chevron-right', 18)}</span>
      </a>`;
  }

  function showRecent() {
    const host = document.getElementById('results');
    const recent = getRecent();
    host.innerHTML = recent.length
      ? `<div class="sec-label"><span>Recently viewed</span><button id="clear-recent">Clear</button></div>${recent.map(rowHtml).join('')}`
      : `<div class="empty-state"><div class="empty-icon"><span data-icon="search"></span></div><p>Search by name — even part of one.</p><p>Try “Mahomes”, “LeBron” or “Ohtani”.</p></div>`;
    const c = host.querySelector('#clear-recent');
    if (c) c.addEventListener('click', () => { try { localStorage.removeItem(RECENT_KEY); } catch (e) {} showRecent(); });
  }

  let searchSeq = 0, timer = null;
  document.getElementById('q').addEventListener('input', (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (q.length < 2) { showRecent(); return; }
    timer = setTimeout(() => runSearch(q), 300);
  });

  async function runSearch(q) {
    const seq = ++searchSeq;
    const host = document.getElementById('results');
    host.innerHTML = sportsSkeleton(4, 'row');
    try {
      const data = await sportsGetJson(`${SEARCH_URL}?query=${encodeURIComponent(q)}&limit=20&type=player`);
      if (seq !== searchSeq) return;
      const items = (data.items || []).filter((i) => i.type === 'player' && i.id && i.sport && (i.defaultLeagueSlug || i.league)).map((i) => ({
        id: String(i.id), name: i.displayName, sport: i.sport, league: i.defaultLeagueSlug || i.league,
        label: i.label || '', pos: i.position && i.position.abbreviation, jersey: i.jersey,
        headshot: i.headshot && i.headshot.href, active: i.isActive !== false,
      }));
      items.sort((a, b) => (b.active ? 1 : 0) - (a.active ? 1 : 0));
      host.innerHTML = items.length ? items.map(rowHtml).join('') : `<div class="empty-state"><p>No players found for “${esc(q)}”.</p></div>`;
    } catch (e) {
      if (seq === searchSeq) host.innerHTML = `<div class="empty-state"><p>Search isn’t working right now — check your connection.</p></div>`;
    }
  }

  // ---------- player page ----------
  const params = new URLSearchParams(location.search);
  if (params.get('id') && params.get('sport') && params.get('league')) {
    document.getElementById('search-view').classList.add('hidden');
    document.getElementById('player-view').classList.remove('hidden');
    document.getElementById('back-link').addEventListener('click', (e) => { if (history.length > 1) { e.preventDefault(); history.back(); } });
    loadPlayer(params.get('sport'), params.get('league'), params.get('id'));
  } else {
    showRecent();
  }

  async function loadPlayer(sport, league, id) {
    const view = document.getElementById('player-view');
    view.innerHTML = `<div class="skel" style="height:150px;border-radius:22px;margin-bottom:14px"></div>${sportsSkeleton(3, 'row')}`;
    const base = `${SPORTS_API_WEB}/${encodeURIComponent(sport)}/${encodeURIComponent(league)}/athletes/${encodeURIComponent(id)}`;
    const [info, overview, gamelog] = await Promise.all([
      sportsGetJson(base).catch(() => null),
      sportsGetJson(base + '/overview').catch(() => null),
      sportsGetJson(base + '/gamelog').catch(() => null),
    ]);
    if (!info && !overview) { view.innerHTML = `<div class="empty-state"><p>Couldn’t load this player — check your connection.</p></div>`; return; }

    const a = (info && info.athlete) || info || {};
    const pick = (k) => (a[k] != null ? a[k] : info && info[k]);
    const team = pick('team') || {};
    const pos = (pick('position') || {}).abbreviation || '';
    const headshot = (pick('headshot') || {}).href || '';
    const name = a.displayName || (info && info.displayName) || 'Player';
    const injuries = pick('injuries') || [];
    const inj = injuries[0] && (injuries[0].status || (injuries[0].type && injuries[0].type.description));
    document.getElementById('page-title').textContent = name;
    document.title = `${name} — Jennings Hub`;
    addRecent({ id, sport, league, name, label: `${LEAGUE_LABEL[league] || league.toUpperCase()}${team.displayName ? ' - ' + team.displayName : ''}`, pos, jersey: a.jersey || pick('displayJersey'), headshot });

    const color = team.color && /^[0-9a-f]{6}$/i.test(team.color) ? '#' + team.color : '';
    const teamLogo = sportsTeamLogo(team);
    const bio = [
      ['Age', pick('age')], ['Height', pick('displayHeight')], ['Weight', pick('displayWeight')],
      ['Experience', pick('displayExperience')], ['College', (pick('college') || {}).name || (pick('college') || {}).shortName], ['Born', pick('displayBirthPlace')],
    ].filter(([, v]) => v);

    let html = `
      <div class="hero" style="${color ? `--tc:${color}` : ''}">
        ${teamLogo ? `<img class="logo-bg" src="${esc(teamLogo)}" alt="">` : ''}
        ${headshot ? `<img class="hs" src="${esc(headshot)}" alt="" onerror="this.remove()">` : ''}
        <div class="info">
          <div class="num">${esc([a.jersey || pick('displayJersey') ? '#' + String(a.jersey || pick('displayJersey')).replace('#', '') : '', pos].filter(Boolean).join(' · '))}</div>
          <div class="nm">${esc(name)}</div>
          <div class="tm">${teamLogo ? `<img src="${esc(teamLogo)}" alt="">` : ''}${esc(team.displayName || LEAGUE_LABEL[league] || '')}</div>
          ${inj ? `<span class="inj">${esc(inj)}</span>` : ''}
        </div>
      </div>
      ${bio.length ? `<div class="bio">${bio.slice(0, 6).map(([k, v]) => `<div><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join('')}</div>` : ''}
      <div class="seg-tabs" id="p-tabs">
        <button data-t="season" class="active">Season</button>
        <button data-t="games">Game Log</button>
        <button data-t="news">News</button>
      </div>
      <div id="p-body"></div>`;
    view.innerHTML = html;

    const tabs = {
      season: () => seasonHtml(info, overview),
      games: () => gamelogHtml(gamelog),
      news: () => newsHtml(overview),
    };
    const show = (t) => {
      view.querySelectorAll('#p-tabs button').forEach((b) => b.classList.toggle('active', b.dataset.t === t));
      document.getElementById('p-body').innerHTML = tabs[t]();
    };
    view.querySelectorAll('#p-tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.t)));
    show('season');
  }

  function seasonHtml(info, ov) {
    let html = '';
    const summary = info && (info.statsSummary || (info.athlete && info.athlete.statsSummary));
    if (summary && (summary.statistics || []).length) {
      html += `<div class="split-h">${esc(summary.displayName || 'This season')}</div><div class="stat-grid">${summary.statistics.map((s) => `
        <div class="stat-tile"><div class="n">${esc(s.displayValue)}</div><div class="k">${esc(s.shortDisplayName || s.abbreviation || s.displayName)}</div>${s.rankDisplayValue ? `<div class="r">${esc(s.rankDisplayValue)}</div>` : ''}</div>`).join('')}</div>`;
    }
    const st = ov && ov.statistics;
    if (st && (st.splits || []).length) {
      const labels = st.labels || [];
      st.splits.forEach((sp) => {
        if (/projected/i.test(sp.displayName || '')) return;
        html += `<div class="split-h">${esc(sp.displayName || '')}</div><div class="stat-grid">${(sp.stats || []).map((v, i) => `
          <div class="stat-tile" title="${esc((st.displayNames || [])[i] || '')}"><div class="n">${esc(v)}</div><div class="k">${esc(labels[i] || '')}</div></div>`).join('')}</div>`;
      });
    }
    return html || `<div class="empty-state"><p>No stats yet this season.</p></div>`;
  }

  // ESPN game log: events{} holds opponent/result; seasonTypes[].categories[].events[] hold the stat lines
  function gamelogHtml(gl) {
    if (!gl || !gl.events) return `<div class="empty-state"><p>No game log available.</p></div>`;
    const labels = gl.labels || [];
    const lines = [];
    (gl.seasonTypes || []).forEach((stype) => (stype.categories || []).forEach((cat) => {
      if (cat.type && cat.type !== 'event') return;
      (cat.events || []).forEach((e) => { if (e.eventId && gl.events[e.eventId]) lines.push({ ev: gl.events[e.eventId], stats: e.stats || [] }); });
    }));
    if (!lines.length) {
      // No stat lines — still list the games
      Object.values(gl.events).forEach((ev) => lines.push({ ev, stats: [] }));
    }
    lines.sort((x, y) => new Date(y.ev.gameDate) - new Date(x.ev.gameDate));
    const shown = lines.slice(0, 12);
    if (!shown.length) return `<div class="empty-state"><p>No games played yet this season.</p></div>`;
    const hasStats = shown.some((l) => l.stats.length);
    return `
      <div class="box-wrap"><table class="gl">
        <thead><tr><th>Game</th><th>Result</th>${hasStats ? labels.map((l) => `<th>${esc(l)}</th>`).join('') : ''}</tr></thead>
        <tbody>${shown.map(({ ev, stats }) => {
          const d = new Date(ev.gameDate);
          const opp = ev.opponent || {};
          return `<tr><td>${esc(d.toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' }))} ${esc(ev.atVs || 'vs')} ${esc(opp.abbreviation || '')}</td><td class="${esc(ev.gameResult || '')}">${esc([ev.gameResult, ev.score].filter(Boolean).join(' '))}</td>${hasStats ? labels.map((_, i) => `<td>${esc(stats[i] != null ? stats[i] : '')}</td>`).join('') : ''}</tr>`;
        }).join('')}</tbody>
      </table></div>
      <p class="helper-text" style="margin-top:10px">Most recent ${shown.length} games this season.</p>`;
  }

  function newsHtml(ov) {
    const arts = ((ov && ov.news) || []).filter((a) => a.headline && a.links && a.links.web && a.links.web.href);
    if (!arts.length) return `<div class="empty-state"><p>No recent news.</p></div>`;
    return arts.slice(0, 10).map((a) => `
      <a class="news-card" href="${esc(a.links.web.href)}" target="_blank" rel="noopener">
        ${a.images && a.images[0] ? sportsImg(a.images[0].url) : ''}
        <div><div class="hl">${esc(a.headline)}</div><div class="meta">${esc(sportsTimeAgo(a.published))}</div></div>
      </a>`).join('');
  }
</script>
</body>
</html>
