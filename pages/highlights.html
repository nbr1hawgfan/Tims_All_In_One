<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highlights — Personal Toolkit</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/boot.js"></script>
<style>
  html, body { background: #000; height: 100%; overflow: hidden; }
  .feed { position: fixed; inset: 0; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
  .feed::-webkit-scrollbar { display: none; }
  .slide { position: relative; height: 100vh; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
  .slide .bg { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(24px) brightness(0.45); }
  .slide video, .slide .poster { position: relative; width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .slide .poster { aspect-ratio: 16 / 9; object-fit: cover; }
  .play-big { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 76px; height: 76px; border-radius: 50%; background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.85); color: #fff; font-size: 1.9rem; display: flex; align-items: center; justify-content: center; text-decoration: none; padding-left: 6px; }
  .overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 80px 18px calc(28px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,0.85)); color: #fff; pointer-events: none; }
  .overlay * { pointer-events: auto; }
  .overlay .tag { display: inline-block; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; background: rgba(255,255,255,0.18); border-radius: 4px; padding: 2px 6px; margin-bottom: 8px; }
  .overlay .hl { font-family: var(--font-display); font-weight: 800; font-size: 1.08rem; line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  .overlay .meta { font-size: 0.76rem; opacity: 0.8; margin-top: 6px; }
  .overlay .espn { display: inline-block; margin-top: 12px; color: #fff; font-size: 0.8rem; font-weight: 700; text-decoration: none; border: 1px solid rgba(255,255,255,0.6); border-radius: 999px; padding: 6px 14px; }
  .side-btns { position: absolute; right: 14px; bottom: calc(150px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  .side-btns button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(0,0,0,0.5); color: #fff; font-size: 1.2rem; cursor: pointer; }

  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(10px + env(safe-area-inset-top)) 12px 18px; background: linear-gradient(rgba(0,0,0,0.7), transparent); display: flex; align-items: center; gap: 8px; }
  .topbar a.back { color: #fff; text-decoration: none; font-size: 1.3rem; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.15); flex-shrink: 0; }
  .topbar .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .topbar .tabs::-webkit-scrollbar { display: none; }
  .topbar .tabs button { flex-shrink: 0; background: none; border: 0; color: rgba(255,255,255,0.65); font-family: var(--font-display); font-weight: 800; font-size: 0.9rem; padding: 6px 8px; cursor: pointer; }
  .topbar .tabs button.active { color: #fff; border-bottom: 2px solid #fff; }
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgba(255,255,255,0.8); text-align: center; padding: 30px; font-size: 0.92rem; gap: 12px; }
  .msg .btn { background: #fff; color: #000; }
</style>
</head>
<body data-sw-path="../sw.js">

<div class="topbar">
  <a href="sports.html" class="back" aria-label="Back to sports">←</a>
  <div class="tabs" id="tabs">
    <button data-league="mine">★ Mine</button>
    <button data-league="all">All</button>
    <button data-league="nfl">NFL</button>
    <button data-league="nba">NBA</button>
    <button data-league="mlb">MLB</button>
    <button data-league="ncaaf">CFB</button>
    <button data-league="ncaab">CBB</button>
  </div>
</div>

<div class="feed" id="feed"></div>
<div class="msg hidden" id="msg"></div>

<script src="../js/app.js"></script>
<script src="../js/sports-common.js"></script>
<script>
  const esc = toolkitEscapeHtml;
  const feed = document.getElementById('feed');
  const msg = document.getElementById('msg');
  const TAB_KEY = 'highlights-last-tab';
  let league;
  try { league = localStorage.getItem(TAB_KEY); } catch (e) {}
  if (!league) league = sportsGetFavs().length ? 'mine' : 'all';
  let muted = true;
  let observer = null;

  const canHls = !!document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

  function setTab() { document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.league === league)); }
  document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
    league = b.dataset.league;
    try { localStorage.setItem(TAB_KEY, league); } catch (e) {}
    setTab();
    load();
  }));
  setTab();

  // Look anywhere inside an article for a direct video file ESPN may include
  function findVideoUrl(obj) {
    const found = { mp4: null, hls: null };
    const walk = (o, depth) => {
      if (!o || depth > 7 || (found.mp4 && found.hls)) return;
      if (typeof o === 'string') {
        if (!/^https:\/\//.test(o)) return;
        if (!found.mp4 && /\.mp4(\?|$)/i.test(o)) found.mp4 = o;
        else if (!found.hls && /\.m3u8(\?|$)/i.test(o)) found.hls = o;
        return;
      }
      if (Array.isArray(o)) { o.forEach((x) => walk(x, depth + 1)); return; }
      if (typeof o === 'object') Object.keys(o).forEach((k) => walk(o[k], depth + 1));
    };
    walk(obj.video || obj.videos || obj, 0);
    if (found.mp4) return found.mp4;
    if (found.hls && canHls) return found.hls;
    return null;
  }

  function isVideo(a) {
    return a.type === 'Media' || a.type === 'Video' || !!(a.video && a.video.length) || /highlight/i.test(a.headline || '');
  }

  async function fetchClips(lk, teamId, teamLabel) {
    const data = await sportsGetJson(`${sportsBase(lk)}/news?limit=50${teamId ? '&team=' + encodeURIComponent(teamId) : ''}`);
    return (data.articles || []).filter((a) => a.headline && isVideo(a)).map((a) => ({
      id: a.id || (a.links && a.links.web && a.links.web.href),
      headline: a.headline,
      published: a.published,
      image: a.images && a.images[0] && a.images[0].url,
      web: (a.links && ((a.links.mobile && a.links.mobile.href) || (a.links.web && a.links.web.href))) || '',
      src: findVideoUrl(a),
      tag: teamLabel || SPORTS_LEAGUES[lk].label,
    }));
  }

  function showMsg(html) {
    feed.innerHTML = '';
    msg.innerHTML = html;
    msg.classList.remove('hidden');
  }

  async function load() {
    const which = league;
    showMsg('<p>Loading highlights…</p>');
    let jobs;
    if (which === 'mine') {
      const favs = sportsGetFavs().slice(0, 10);
      if (!favs.length) {
        showMsg(`<div style="font-size:2rem">⭐</div><p>Follow your teams to get a highlight feed just for them.</p><button class="btn" id="pick">Pick my teams</button>`);
        msg.querySelector('#pick').addEventListener('click', () => sportsOpenTeamPicker(load));
        return;
      }
      jobs = favs.map((f) => fetchClips(f.league, f.id, f.abbr || f.name));
    } else if (which === 'all') {
      jobs = Object.keys(SPORTS_LEAGUES).map((lk) => fetchClips(lk));
    } else {
      jobs = [fetchClips(which)];
    }
    const lists = await Promise.all(jobs.map((j) => j.catch(() => null)));
    if (which !== league) return;
    if (lists.every((l) => l === null)) { showMsg('<p>Couldn’t load highlights — check your connection.</p>'); return; }
    const seen = new Set();
    const clips = [];
    lists.filter(Boolean).flat().forEach((c) => { if (!seen.has(c.id)) { seen.add(c.id); clips.push(c); } });
    clips.sort((a, b) => new Date(b.published) - new Date(a.published));
    if (!clips.length) { showMsg('<div style="font-size:2rem">🎬</div><p>No highlight clips right now.</p><p>Check back after games wrap up.</p>'); return; }
    msg.classList.add('hidden');
    render(clips);
  }

  function render(clips) {
    if (observer) observer.disconnect();
    feed.scrollTop = 0;
    feed.innerHTML = clips.map((c, i) => `
      <section class="slide" data-i="${i}">
        ${c.image ? `<div class="bg" style="background-image:url('${esc(c.image)}')"></div>` : ''}
        ${c.src
          ? `<video src="${esc(c.src)}" ${c.image ? `poster="${esc(c.image)}"` : ''} playsinline webkit-playsinline loop muted preload="none"></video>`
          : `${c.image ? `<img class="poster" src="${esc(c.image)}" alt="" loading="lazy">` : ''}<a class="play-big" href="${esc(c.web)}" target="_blank" rel="noopener" aria-label="Watch on ESPN">▶</a>`}
        ${c.src ? `<div class="side-btns"><button class="mute-btn" aria-label="Sound">${muted ? '🔇' : '🔊'}</button></div>` : ''}
        <div class="overlay">
          <div class="tag">${esc(c.tag)}</div>
          <div class="hl">${esc(c.headline)}</div>
          <div class="meta">${esc(sportsTimeAgo(c.published))}</div>
          ${c.web ? `<a class="espn" href="${esc(c.web)}" target="_blank" rel="noopener">${c.src ? 'Open on ESPN ↗' : 'Watch on ESPN ↗'}</a>` : ''}
        </div>
      </section>`).join('');

    feed.querySelectorAll('video').forEach((v) => {
      v.addEventListener('click', () => { if (v.paused) v.play().catch(() => {}); else v.pause(); });
      v.addEventListener('error', () => {
        // Clip won't play here — swap in the "watch on ESPN" poster instead
        const slide = v.closest('.slide');
        const c = clips[parseInt(slide.dataset.i, 10)];
        v.outerHTML = `${c.image ? `<img class="poster" src="${esc(c.image)}" alt="">` : ''}<a class="play-big" href="${esc(c.web)}" target="_blank" rel="noopener" aria-label="Watch on ESPN">▶</a>`;
        const sb = slide.querySelector('.side-btns'); if (sb) sb.remove();
      });
    });
    feed.querySelectorAll('.mute-btn').forEach((b) => b.addEventListener('click', () => {
      muted = !muted;
      feed.querySelectorAll('video').forEach((v) => { v.muted = muted; });
      feed.querySelectorAll('.mute-btn').forEach((x) => { x.textContent = muted ? '🔇' : '🔊'; });
    }));

    // Play only the clip that's on screen, like a TikTok feed
    if ('IntersectionObserver' in window) {
      observer = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          const v = en.target.querySelector('video');
          if (!v) return;
          if (en.isIntersecting && en.intersectionRatio > 0.6) {
            v.preload = 'auto';
            v.muted = muted;
            v.play().catch(() => {});
          } else {
            v.pause();
          }
        });
      }, { root: feed, threshold: [0, 0.6, 1] });
      feed.querySelectorAll('.slide').forEach((s) => observer.observe(s));
    }
  }

  load();
</script>
</body>
</html>
