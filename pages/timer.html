<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer &amp; Stopwatch — Personal Toolkit</title>
<meta name="theme-color" content="#0a5870">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  .mode-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
  .mode-toggle button {
    flex: 1; padding: 10px 0; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); font-family: var(--font-display); font-weight: 700; cursor: pointer;
  }
  .mode-toggle button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .big-clock {
    font-family: var(--font-mono); font-size: 3.2rem; font-weight: 600; text-align: center;
    color: var(--primary-dark); background: var(--primary-wash); border-radius: var(--radius-lg);
    padding: 30px 10px; margin-bottom: 18px; letter-spacing: 0.02em;
  }
  .set-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .set-row > div { flex: 1; }
  .set-row input { text-align: center; font-family: var(--font-mono); font-size: 1.1rem; }
  .preset-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .preset-row button {
    flex: 1; padding: 8px 0; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); font-family: var(--font-mono); font-weight: 600; cursor: pointer; color: var(--primary-dark);
  }
  .lap-list { margin-top: 14px; }
</style>
</head>
<body data-sw-path="../sw.js">

<header class="app-header">
  <a href="../index.html" class="back-link" aria-label="Back to home">←</a>
  <div><h1>Timer &amp; Stopwatch</h1></div>
</header>

<main class="shell">
  <div class="mode-toggle">
    <button id="mode-timer" class="active">Timer</button>
    <button id="mode-stopwatch">Stopwatch</button>
  </div>

  <!-- ============ TIMER ============ -->
  <div id="panel-timer">
    <div class="big-clock" id="timer-display">05:00</div>
    <div class="set-row" id="timer-set-row">
      <div>
        <label for="timer-min">Minutes</label>
        <input type="number" id="timer-min" inputmode="numeric" value="5" min="0">
      </div>
      <div>
        <label for="timer-sec">Seconds</label>
        <input type="number" id="timer-sec" inputmode="numeric" value="0" min="0" max="59">
      </div>
    </div>
    <div class="preset-row">
      <button data-preset="60">1 min</button>
      <button data-preset="300">5 min</button>
      <button data-preset="600">10 min</button>
      <button data-preset="900">15 min</button>
    </div>
    <div class="btn-row">
      <button class="btn" id="timer-start-btn" style="flex:1;">Start</button>
      <button class="btn secondary" id="timer-reset-btn" style="flex:1;">Reset</button>
    </div>
  </div>

  <!-- ============ STOPWATCH ============ -->
  <div id="panel-stopwatch" style="display:none;">
    <div class="big-clock" id="stopwatch-display">00:00.0</div>
    <div class="btn-row">
      <button class="btn" id="stopwatch-start-btn" style="flex:1;">Start</button>
      <button class="btn secondary" id="stopwatch-lap-btn" style="flex:1;" disabled>Lap</button>
      <button class="btn secondary" id="stopwatch-reset-btn" style="flex:1;">Reset</button>
    </div>
    <div class="row-list lap-list" id="lap-list"></div>
  </div>
</main>

<script src="../js/app.js"></script>
<script>
  document.getElementById('mode-timer').addEventListener('click', () => setMode('timer'));
  document.getElementById('mode-stopwatch').addEventListener('click', () => setMode('stopwatch'));
  function setMode(mode) {
    document.getElementById('mode-timer').classList.toggle('active', mode === 'timer');
    document.getElementById('mode-stopwatch').classList.toggle('active', mode === 'stopwatch');
    document.getElementById('panel-timer').style.display = mode === 'timer' ? '' : 'none';
    document.getElementById('panel-stopwatch').style.display = mode === 'stopwatch' ? '' : 'none';
  }

  // ---------- Audio beep (Web Audio API — no sound file needed) ----------
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 300, 600].forEach((delay) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, ctx.currentTime + delay / 1000);
        gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + delay / 1000 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay / 1000 + 0.25);
        osc.start(ctx.currentTime + delay / 1000);
        osc.stop(ctx.currentTime + delay / 1000 + 0.26);
      });
    } catch (e) { /* audio unsupported — vibration below still fires */ }
    try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) {}
  }

  // ---------- Timer ----------
  let timerRemaining = 300;
  let timerTotal = 300;
  let timerInterval = null;
  let timerRunning = false;

  function fmtTimer(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = Math.floor(totalSeconds % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  function renderTimer() { document.getElementById('timer-display').textContent = fmtTimer(Math.max(0, timerRemaining)); }

  function setTimerFromInputs() {
    const min = parseInt(document.getElementById('timer-min').value, 10) || 0;
    const sec = parseInt(document.getElementById('timer-sec').value, 10) || 0;
    timerTotal = min * 60 + sec;
    timerRemaining = timerTotal;
    renderTimer();
  }
  document.getElementById('timer-min').addEventListener('input', setTimerFromInputs);
  document.getElementById('timer-sec').addEventListener('input', setTimerFromInputs);
  document.querySelectorAll('.preset-row button').forEach((btn) => {
    btn.addEventListener('click', () => {
      const total = parseInt(btn.dataset.preset, 10);
      document.getElementById('timer-min').value = Math.floor(total / 60);
      document.getElementById('timer-sec').value = total % 60;
      setTimerFromInputs();
    });
  });

  let timerEndAt = null;
  document.getElementById('timer-start-btn').addEventListener('click', () => {
    if (timerRunning) {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timer-start-btn').textContent = 'Resume';
      document.getElementById('timer-set-row').style.opacity = '1';
      return;
    }
    if (timerRemaining <= 0) { toolkitToast('Set a time first', { danger: true }); return; }
    timerRunning = true;
    timerEndAt = Date.now() + timerRemaining * 1000;
    document.getElementById('timer-start-btn').textContent = 'Pause';
    document.getElementById('timer-set-row').style.opacity = '0.5';
    timerInterval = setInterval(() => {
      timerRemaining = Math.round((timerEndAt - Date.now()) / 1000);
      if (timerRemaining <= 0) {
        timerRemaining = 0;
        renderTimer();
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById('timer-start-btn').textContent = 'Start';
        playBeep();
        toolkitToast("Time's up!");
        return;
      }
      renderTimer();
    }, 250);
  });

  document.getElementById('timer-reset-btn').addEventListener('click', () => {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('timer-start-btn').textContent = 'Start';
    document.getElementById('timer-set-row').style.opacity = '1';
    setTimerFromInputs();
  });

  renderTimer();

  // ---------- Stopwatch ----------
  let swElapsed = 0;
  let swStartedAt = null;
  let swInterval = null;
  let swRunning = false;
  let laps = [];

  function fmtStopwatch(ms) {
    const cs = Math.floor((ms % 1000) / 100);
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${cs}`;
  }
  function renderStopwatch() {
    const current = swRunning ? swElapsed + (Date.now() - swStartedAt) : swElapsed;
    document.getElementById('stopwatch-display').textContent = fmtStopwatch(current);
  }

  document.getElementById('stopwatch-start-btn').addEventListener('click', () => {
    if (swRunning) {
      swElapsed += Date.now() - swStartedAt;
      swRunning = false;
      clearInterval(swInterval);
      document.getElementById('stopwatch-start-btn').textContent = 'Resume';
      document.getElementById('stopwatch-lap-btn').disabled = true;
    } else {
      swStartedAt = Date.now();
      swRunning = true;
      document.getElementById('stopwatch-start-btn').textContent = 'Pause';
      document.getElementById('stopwatch-lap-btn').disabled = false;
      swInterval = setInterval(renderStopwatch, 50);
    }
  });

  document.getElementById('stopwatch-lap-btn').addEventListener('click', () => {
    const current = swElapsed + (Date.now() - swStartedAt);
    laps.unshift(current);
    renderLaps();
  });

  document.getElementById('stopwatch-reset-btn').addEventListener('click', () => {
    clearInterval(swInterval);
    swElapsed = 0; swRunning = false; laps = [];
    document.getElementById('stopwatch-start-btn').textContent = 'Start';
    document.getElementById('stopwatch-lap-btn').disabled = true;
    renderStopwatch();
    renderLaps();
  });

  function renderLaps() {
    const listEl = document.getElementById('lap-list');
    listEl.innerHTML = '';
    laps.forEach((ms, i) => {
      const row = document.createElement('div');
      row.className = 'row-item';
      row.innerHTML = `<div class="row-main"><div class="row-title">Lap ${laps.length - i}</div></div><div class="mono">${fmtStopwatch(ms)}</div>`;
      listEl.appendChild(row);
    });
  }

  renderStopwatch();
</script>
</body>
</html>
