<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports News — Personal Toolkit</title>
<meta name="theme-color" content="#0a5870">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  .news-lead { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 12px; text-decoration: none; color: var(--text); }
  .news-lead img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--surface-sunken); }
  .news-lead .txt { padding: 12px 14px; }
  .news-lead .hl { font-family: var(--font-display); font-weight: 800; font-size: 1.02rem; line-height: 1.3; }
  .news-lead .ds { font-size: 0.84rem; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }
  .news-card { display: flex; gap: 12px; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; text-decoration: none; color: var(--text); }
  .news-card img { width: 96px; height: 64px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: var(--surface-sunken); }
  .news-card .hl { font-weight: 700; font-size: 0.86rem; line-height: 1.3; }
  .meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .meta .tag { font-weight: 800; color: var(--primary-light); }
  .play-badge { display: inline-block; background: var(--danger); color: #fff; font-size: 0.62rem; font-weight: 800; border-radius: 4px; padding: 1px 5px; margin-right: 4px; vertical-align: 1px; }
</style>
</head>
<body data-sw-path="../sw.js">

<header class="app-header">
  <a href="../index.html" class="back-link" aria-label="Back to home">←</a>
  <div><h1>Sports News</h1></div>
</header>

<main class="shell">
  <div id="nav-slot"></div>
  <div class="league-tabs" id="league-tabs">
    <button data-league="mine">★ Mine</button>
    <button data-league="nfl">NFL</button>
    <button data-league="nba">NBA</button>
    <button data-league="mlb">MLB</button>
    <button data-league="ncaaf">CFB</button>
    <button data-league="ncaab">CBB</button>
  </div>
  <div id="body"></div>
  <p class="helper-text" style="text-align:center;">Stories open on ESPN. Video stories are also in Highlights.</p>
</main>

<script src="../js/app.js"></script>
<script src="../js/sports-common.js"></script>
<script>
  const esc = toolkitEscapeHtml;
  document.getElementById('nav-slot').replaceWith(sportsRenderNav('news'));

  const TAB_KEY = 'news-last-tab';
  let league;
  try { league = localStorage.getItem(TAB_KEY); } catch (e) {}
  if (league !== 'mine' && !SPORTS_LEAGUES[league]) league = sportsGetFavs().length ? 'mine' : 'nfl';

  function setTab() { document.querySelectorAll('#league-tabs button').forEach((b) => b.classList.toggle('active', b.dataset.league === league)); }
  document.querySelectorAll('#league-tabs button').forEach((b) => b.addEventListener('click', () => {
    league = b.dataset.league;
    try { localStorage.setItem(TAB_KEY, league); } catch (e) {}
    setTab();
    load();
  }));
  setTab();

  async function fetchArticles(lk, teamId) {
    const url = `${sportsBase(lk)}/news?limit=30${teamId ? '&team=' + encodeURIComponent(teamId) : ''}`;
    const data = await sportsGetJson(url);
    return (data.articles || []).filter((a) => a.headline && a.links && a.links.web && a.links.web.href).map((a) => ({ ...a, _league: lk }));
  }

  async function load() {
    const body = document.getElementById('body');
    const which = league;
    body.innerHTML = `<div class="empty-state"><p>Loading news…</p></div>`;
    let arts = [];
    try {
      if (which === 'mine') {
        const favs = sportsGetFavs().slice(0, 10);
        if (!favs.length) {
          body.innerHTML = `<div class="empty-state"><div class="empty-icon">⭐</div><p>Follow your teams to get a news feed just for them.</p><button class="btn" id="pick" style="margin-top:10px;">Pick my teams</button></div>`;
          body.querySelector('#pick').addEventListener('click', () => sportsOpenTeamPicker(load));
          return;
        }
        const lists = await Promise.all(favs.map((f) => fetchArticles(f.league, f.id).then((list) => list.map((a) => ({ ...a, _team: f.abbr || f.name }))).catch(() => [])));
        const seen = new Set();
        lists.flat().forEach((a) => {
          const key = a.links.web.href;
          if (!seen.has(key)) { seen.add(key); arts.push(a); }
        });
        arts.sort((a, b) => new Date(b.published) - new Date(a.published));
      } else {
        arts = await fetchArticles(which);
      }
    } catch (e) {
      if (which === league) body.innerHTML = `<div class="empty-state"><p>Couldn’t load news — check your connection.</p></div>`;
      return;
    }
    if (which !== league) return;
    if (!arts.length) { body.innerHTML = `<div class="empty-state"><p>No news right now.</p></div>`; return; }

    const meta = (a) => `<div class="meta">${a._team ? `<span class="tag">${esc(a._team)}</span>` : ''}<span>${esc(sportsTimeAgo(a.published))}</span></div>`;
    const badge = (a) => a.type === 'Media' ? '<span class="play-badge">▶ VIDEO</span>' : '';
    const [lead, ...rest] = arts;
    body.innerHTML = `
      <a class="news-lead" href="${esc(lead.links.web.href)}" target="_blank" rel="noopener">
        ${lead.images && lead.images[0] ? sportsImg(lead.images[0].url) : ''}
        <div class="txt">
          <div class="hl">${badge(lead)}${esc(lead.headline)}</div>
          ${lead.description && lead.description !== lead.headline ? `<div class="ds">${esc(lead.description)}</div>` : ''}
          ${meta(lead)}
        </div>
      </a>
      ${rest.map((a) => `
        <a class="news-card" href="${esc(a.links.web.href)}" target="_blank" rel="noopener">
          ${a.images && a.images[0] ? sportsImg(a.images[0].url) : ''}
          <div><div class="hl">${badge(a)}${esc(a.headline)}</div>${meta(a)}</div>
        </a>`).join('')}`;
  }

  load();
</script>
</body>
</html>
