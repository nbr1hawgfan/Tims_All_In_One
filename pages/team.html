<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team — Personal Toolkit</title>
<meta name="theme-color" content="#0a5870">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  .team-hero { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .team-hero::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--team-color, var(--primary-light)); }
  .team-hero img { width: 64px; height: 64px; object-fit: contain; }
  .team-hero .nm { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
  .team-hero .sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
  .team-hero .star { margin-left: auto; font-size: 1.6rem; }
  .seg-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg-tabs button { flex: 1; padding: 9px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; cursor: pointer; }
  .seg-tabs button.active { background: var(--primary); color: #fff; border-color: transparent; }

  .sched-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; text-decoration: none; color: var(--text); }
  .sched-row .dt { width: 52px; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; line-height: 1.25; }
  .sched-row img { width: 26px; height: 26px; object-fit: contain; }
  .sched-row .opp { flex: 1; min-width: 0; font-weight: 600; font-size: 0.88rem; }
  .sched-row .opp small { color: var(--text-muted); font-weight: 500; margin-right: 4px; }
  .sched-row .res { font-family: var(--font-mono); font-weight: 700; font-size: 0.82rem; text-align: right; white-space: nowrap; }
  .sched-row .res.W { color: var(--success); } .sched-row .res.L { color: var(--danger); }
  .sched-row .res.live { color: var(--danger); }
  .sched-row.next { border-color: var(--primary-light); box-shadow: var(--shadow-sm); }

  .roster-group { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 800; margin: 14px 0 6px; }
  .ros-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .ros-row img, .ros-row .ph { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--surface-sunken); flex-shrink: 0; }
  .ros-row .jn { width: 30px; font-family: var(--font-mono); color: var(--text-muted); font-size: 0.8rem; text-align: right; }
  .ros-row .pm { flex: 1; min-width: 0; }
  .ros-row .pm div:first-child { font-weight: 700; font-size: 0.88rem; }
  .ros-row .pm div:last-child { font-size: 0.72rem; color: var(--text-muted); }

  .news-card { display: flex; gap: 12px; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; text-decoration: none; color: var(--text); }
  .news-card img { width: 92px; height: 62px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: var(--surface-sunken); }
  .news-card .hl { font-weight: 700; font-size: 0.86rem; line-height: 1.3; }
  .news-card .meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body data-sw-path="../sw.js">

<header class="app-header">
  <a href="sports.html" class="back-link" id="back-link" aria-label="Back">←</a>
  <div><h1 id="page-title">Team</h1></div>
</header>

<main class="shell">
  <div class="team-hero" id="hero"><div class="sub">Loading team…</div></div>
  <div class="seg-tabs" id="tabs">
    <button data-tab="schedule" class="active">Schedule</button>
    <button data-tab="roster">Roster</button>
    <button data-tab="news">News</button>
  </div>
  <div id="body"></div>
</main>

<script src="../js/app.js"></script>
<script src="../js/sports-common.js"></script>
<script>
  const esc = toolkitEscapeHtml;
  const params = new URLSearchParams(location.search);
  const leagueKey = SPORTS_LEAGUES[params.get('league')] ? params.get('league') : 'nfl';
  const teamId = params.get('id') || '';
  const base = sportsBase(leagueKey);
  let team = null;
  let tab = 'schedule';
  const cache = {};

  document.getElementById('back-link').addEventListener('click', (e) => {
    if (history.length > 1 && document.referrer) { e.preventDefault(); history.back(); }
  });

  async function loadTeam() {
    try {
      const data = await sportsGetJson(`${base}/teams/${encodeURIComponent(teamId)}`);
      team = data.team;
      if (!team) throw new Error('no team');
      document.title = `${team.displayName} — Personal Toolkit`;
      document.getElementById('page-title').textContent = team.shortDisplayName || team.displayName;
      renderHero();
    } catch (e) {
      // Fall back to what we know locally (followed team or built-in list)
      const fav = sportsGetFavs().find((f) => f.league === leagueKey && String(f.id) === String(teamId));
      const known = fav ? { id: fav.id, displayName: fav.name, abbreviation: fav.abbr, logo: fav.logo } : sportsBuiltinTeams(leagueKey).find((t) => String(t.id) === String(teamId));
      if (known) {
        team = known;
        document.getElementById('page-title').textContent = known.shortDisplayName || known.abbreviation || known.displayName;
        renderHero();
      } else {
        document.getElementById('hero').innerHTML = `<div class="sub">Couldn’t load this team — check your connection.</div>`;
      }
    }
  }

  function renderHero() {
    const rec = team.record && team.record.items && team.record.items[0] ? team.record.items[0].summary : '';
    const fav = sportsIsFav(leagueKey, team.id);
    const hero = document.getElementById('hero');
    if (team.color) hero.style.setProperty('--team-color', '#' + String(team.color).replace('#', ''));
    hero.innerHTML = `
      ${sportsImg(sportsTeamLogo(team))}
      <div>
        <div class="nm">${esc(team.displayName)}</div>
        <div class="sub">${esc([SPORTS_LEAGUES[leagueKey].label, rec, team.standingSummary].filter(Boolean).join(' · '))}</div>
      </div>
      <button class="star ${fav ? 'on' : ''}" id="fav-btn" aria-label="Follow team">${fav ? '★' : '☆'}</button>`;
    hero.querySelector('#fav-btn').addEventListener('click', () => {
      const on = sportsToggleFav(leagueKey, team);
      toolkitToast(on ? `Following ${team.shortDisplayName || team.displayName}` : 'Unfollowed');
      renderHero();
    });
  }

  document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('active', x === b));
    renderBody();
  }));

  async function fetchOnce(key, url) {
    if (!cache[key]) cache[key] = sportsGetJson(url);
    return cache[key];
  }

  async function renderBody() {
    const body = document.getElementById('body');
    const which = tab;
    body.innerHTML = `<div class="empty-state"><p>Loading…</p></div>`;
    try {
      if (which === 'schedule') await renderSchedule(body);
      if (which === 'roster') await renderRoster(body);
      if (which === 'news') await renderNews(body);
    } catch (e) {
      if (tab === which) body.innerHTML = `<div class="empty-state"><p>Couldn’t load this — check your connection.</p></div>`;
    }
  }

  async function renderSchedule(body) {
    const data = await fetchOnce('sched', `${base}/teams/${encodeURIComponent(teamId)}/schedule`);
    if (tab !== 'schedule') return;
    const events = data.events || [];
    if (!events.length) { body.innerHTML = `<div class="empty-state"><p>No schedule posted yet.</p></div>`; return; }
    let nextMarked = false;
    body.innerHTML = events.map((ev) => {
      const comp = (ev.competitions || [])[0] || {};
      const cs = comp.competitors || [];
      const me = cs.find((c) => String(c.team && c.team.id) === String(teamId)) || {};
      const opp = cs.find((c) => c !== me) || {};
      const st = (comp.status || ev.status || {}).type || {};
      const d = new Date(ev.date);
      const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const timeStr = st.state === 'pre' ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
      let res = '', cls = '';
      if (st.state === 'post') {
        const ms = sportsScore(me.score), os = sportsScore(opp.score);
        const won = me.winner === true || (me.winner == null && parseFloat(ms) > parseFloat(os));
        cls = won ? 'W' : (parseFloat(ms) === parseFloat(os) ? '' : 'L');
        res = `${cls || 'T'} ${ms}-${os}`;
      } else if (st.state === 'in') {
        cls = 'live';
        res = `${sportsScore(me.score)}-${sportsScore(opp.score)} · LIVE`;
      } else {
        res = esc(timeStr || st.shortDetail || '');
      }
      const isNext = !nextMarked && st.state !== 'post';
      if (isNext) nextMarked = true;
      const ot = opp.team || {};
      const vs = me.homeAway === 'home' ? 'vs' : '@';
      const title = `${me.homeAway === 'home' ? (ot.abbreviation || '') + ' @ ' + (team && team.abbreviation || '') : (team && team.abbreviation || '') + ' @ ' + (ot.abbreviation || '')}`;
      const href = st.state === 'pre' && !isNext ? '' : `sports.html?league=${leagueKey}&game=${encodeURIComponent(ev.id)}&title=${encodeURIComponent(title)}`;
      const week = ev.week && ev.week.text ? ev.week.text : (ev.week && ev.week.number ? 'Wk ' + ev.week.number : '');
      return `
        <${href ? `a href="${href}"` : 'div'} class="sched-row ${isNext ? 'next' : ''}">
          <div class="dt">${esc(dateStr)}<br>${esc(week)}</div>
          ${sportsImg(sportsTeamLogo(ot))}
          <div class="opp"><small>${vs}</small>${esc(ot.shortDisplayName || ot.displayName || 'TBD')}</div>
          <div class="res ${cls}">${res}</div>
        </${href ? 'a' : 'div'}>`;
    }).join('');
    const next = body.querySelector('.sched-row.next');
    if (next && next.scrollIntoView) next.scrollIntoView({ block: 'center' });
  }

  async function renderRoster(body) {
    const data = await fetchOnce('roster', `${base}/teams/${encodeURIComponent(teamId)}/roster`);
    if (tab !== 'roster') return;
    let groups = data.athletes || [];
    // NFL/MLB come grouped ({position, items}); NBA/college come as one flat list
    if (groups.length && !groups[0].items) groups = [{ position: '', items: groups }];
    const row = (a) => {
      const head = a.headshot && a.headshot.href;
      const bits = [a.position && a.position.abbreviation, a.age ? a.age + ' yrs' : '', a.displayHeight, a.experience && a.experience.years != null ? (a.experience.years ? a.experience.years + ' yr exp' : 'Rookie') : '', a.college && (a.college.shortName || a.college.name)].filter(Boolean);
      return `
        <div class="ros-row">
          <div class="jn">${a.jersey ? '#' + esc(a.jersey) : ''}</div>
          ${head ? sportsImg(head) : '<div class="ph"></div>'}
          <div class="pm"><div>${esc(a.displayName || a.fullName)}</div><div>${esc(bits.join(' · '))}</div></div>
        </div>`;
    };
    const html = groups.map((g) => {
      const label = { offense: 'Offense', defense: 'Defense', specialTeam: 'Special Teams', pitchers: 'Pitchers', catchers: 'Catchers', infielders: 'Infielders', outfielders: 'Outfielders', designatedHitter: 'Designated Hitter' }[g.position] || g.position || '';
      return (label ? `<div class="roster-group">${esc(label)}</div>` : '') + (g.items || []).map(row).join('');
    }).join('');
    body.innerHTML = html ? `<div class="card" style="padding:4px 14px 10px;">${html}</div>` : `<div class="empty-state"><p>No roster available.</p></div>`;
  }

  async function renderNews(body) {
    const data = await fetchOnce('news', `${base}/news?team=${encodeURIComponent(teamId)}&limit=25`);
    if (tab !== 'news') return;
    const arts = (data.articles || []).filter((a) => a.headline && a.links && a.links.web && a.links.web.href);
    if (!arts.length) { body.innerHTML = `<div class="empty-state"><p>No recent news.</p></div>`; return; }
    body.innerHTML = arts.map((a) => `
      <a class="news-card" href="${esc(a.links.web.href)}" target="_blank" rel="noopener">
        ${a.images && a.images[0] ? sportsImg(a.images[0].url) : ''}
        <div>
          <div class="hl">${a.type === 'Media' ? '▶ ' : ''}${esc(a.headline)}</div>
          <div class="meta">${esc(sportsTimeAgo(a.published))}</div>
        </div>
      </a>`).join('');
  }

  if (!teamId) {
    document.getElementById('hero').innerHTML = `<div class="sub">No team picked.</div>`;
  } else {
    loadTeam();
    renderBody();
  }
</script>
</body>
</html>
